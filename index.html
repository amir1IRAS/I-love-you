<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Style Heart Text Animation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
        }
        .turtle-glow {
            filter: drop-shadow(0 0 8px #ffb6c1);
        }
    </style>
</head>
<body class="relative w-screen h-screen m-0 p-0 text-white bg-black overflow-hidden select-none cursor-pointer">
    <!-- Minimalist Floating Control Pill with matching soft pink translucent theme -->
    <div class="fixed top-4 right-4 z-20 flex items-center gap-1.5 opacity-45 hover:opacity-100 transition-all duration-300 backdrop-blur-md bg-[#ffb6c1]/10 border border-[#ffb6c1]/25 px-2.5 py-1 rounded-full text-xs font-mono shadow-[0_0_12px_rgba(255,182,193,0.15)]">
        <!-- Speed Cycle Button (0.7 -> 0.5 -> 1 -> 0.7) -->
        <button id="speedToggleBtn" type="button" aria-label="تغییر سرعت" class="px-2 py-0.5 rounded-full text-[#ffb6c1]/85 hover:text-[#ffb6c1] hover:bg-[#ffb6c1]/15 transition-all duration-200 cursor-pointer outline-none">
            0.7x
        </button>

        <span class="w-px h-3 bg-[#ffb6c1]/30"></span>

        <!-- Replay SVG Icon Button -->
        <button id="replayBtn" type="button" aria-label="رسم مجدد" title="رسم مجدد" class="p-1 rounded-full text-[#ffb6c1]/85 hover:text-[#ffb6c1] hover:bg-[#ffb6c1]/15 hover:rotate-180 transition-all duration-500 cursor-pointer outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>

    <!-- Background Animated Canvas -->
    <canvas id="heartCanvas" class="absolute inset-0 w-full h-full block z-0"></canvas>

    <script>
    (function () {
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const speedToggleBtn = document.getElementById('speedToggleBtn');
        const replayBtn = document.getElementById('replayBtn');

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        // Points generated exactly matching the Python Turtle nested loops:
        let drawingPoints = [];
        let currentIndex = 0;
        
        // Speed options: 0.7, 0.5, 1
        const speedOptions = [0.7, 0.5, 1.0];
        let speedIndex = 0; // Starts at 0.7
        let speedRate = speedOptions[speedIndex];
        let isComplete = false;
        let pulsePhase = 0;

        function generateHeartPoints() {
            drawingPoints = [];
            const isMobile = width < 768;
            // Base visual multiplier so it fits nicely on any screen size
            const visualScaleRatio = isMobile ? Math.min(width, height) / 600 : Math.min(width, height) / 500;

            // Python range(11, 17) => scales 11, 12, 13, 14, 15, 16
            for (let scale = 11; scale < 17; scale++) {
                const currentScale = scale * visualScaleRatio;
                for (let i = 0; i < 120; i++) {
                    const angle = i * (Math.PI * 2) / 120;

                    // Exact Python formulas:
                    const x = 16 * Math.pow(Math.sin(angle), 3) * currentScale;
                    const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * currentScale;

                    drawingPoints.push({
                        x: x,
                        y: y,
                        scale: scale,
                        angle: angle,
                        text: "I love you"
                    });
                }
            }
        }

        function restartDrawing() {
            currentIndex = 0;
            isComplete = false;
            pulsePhase = 0;
            generateHeartPoints();
        }

        function handleResize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateHeartPoints();
        }
        window.addEventListener('resize', handleResize);

        function drawFrame() {
            requestAnimationFrame(drawFrame);

            const centerX = width / 2;
            const centerY = height / 2;

            if (!isComplete) {
                // Clear background with deep pitch black
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                // پیشروی آرام و تدریجی
                currentIndex = Math.min(drawingPoints.length, currentIndex + speedRate);
                const visibleCount = Math.floor(currentIndex);

                // Render drawn words
                ctx.save();
                ctx.fillStyle = '#ffb6c1';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 9px Arial, sans-serif';

                for (let k = 0; k < visibleCount; k++) {
                    const pt = drawingPoints[k];
                    ctx.fillText(pt.text, centerX + pt.x, centerY + pt.y);
                }
                ctx.restore();

                if (visibleCount >= drawingPoints.length) {
                    isComplete = true;
                }
            } else {
                // تپش ملایم و ارگانیک پس از پایان رسم
                pulsePhase += 0.04;
                const beat = 1 + Math.sin(pulsePhase) * 0.035;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                ctx.fillStyle = '#ffb6c1';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 9px Arial, sans-serif';
                ctx.shadowColor = 'rgba(255, 182, 193, 0.45)';
                ctx.shadowBlur = 6;

                for (let k = 0; k < drawingPoints.length; k++) {
                    const pt = drawingPoints[k];
                    ctx.fillText(pt.text, centerX + pt.x * beat, centerY + pt.y * beat);
                }
                ctx.restore();
            }
        }

        // Replay button handler
        replayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            restartDrawing();
        });

        // Speed toggle button handler (cycles between 0.7, 0.5, 1)
        speedToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            speedIndex = (speedIndex + 1) % speedOptions.length;
            speedRate = speedOptions[speedIndex];
            speedToggleBtn.innerText = `${speedRate}x`;
        });

        // Tap or click canvas background to replay once finished
        window.addEventListener('click', () => {
            if (isComplete) {
                restartDrawing();
            }
        });

        // Auto start on page load
        window.onload = function () {
            restartDrawing();
            drawFrame();
        };
    })();
    </script>
</body>
</html>
